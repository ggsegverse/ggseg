url: https://ggsegverse.github.io/ggseg/

template:
  package: ggseg.docs

navbar:
  components:
    github:
      icon: fa-github
      href: https://github.com/ggsegverse/ggseg
      aria-label: GitHub
    articles:
      text: Articles
      menu:
        - text: Getting Started
        - text: Introduction
          href: articles/ggseg.html
        - text: External Data
          href: articles/external-data.html
        - text: -------
        - text: Advanced Usage
        - text: How geom_brain() works
          href: articles/how-geom-brain-works.html
        - text: Positioning Views
          href: articles/positioning-views.html
        - text: Using geom_sf
          href: articles/geom-sf.html
        - text: FreeSurfer Files
          href: articles/freesurfer-files.html

articles:
  - title: Getting Started
    navbar: ~
    contents:
      - ggseg
      - external-data

  - title: Advanced Usage
    contents:
      - how-geom-brain-works
      - positioning-views
      - geom-sf
      - freesurfer-files

reference:
  # Selectors rather than a hand-kept list: a new geom_*/stat_*/position_*
  # lands in the index on its own, instead of failing the pkgdown build the
  # first time someone adds one and forgets this file.
  - title: Plotting
    desc: Core geom and positioning for brain plots
    contents:
      - starts_with("geom_")
      - starts_with("stat_")
      - starts_with("position_")
      - starts_with("coord_")
      - starts_with("annotate_")
      - reposition_brain
      - brain_test_plot
      - brain_layer_data

  - title: Data
    desc: Joining user data to brain atlases
    contents:
      - brain_join

  - title: Scales
    desc: Colour scales for brain plots
    contents:
      - starts_with("scale")

  - title: Themes
    desc: ggplot themes for brain plots
    contents:
      - starts_with("theme")
