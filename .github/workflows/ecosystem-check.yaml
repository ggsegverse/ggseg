# Drives one atlas through the whole suite in a single process, with this
# repo at the pull-request ref and every other package from main.
#
# This is also what satisfies the T2 reverse-dependency obligation here:
# check-tier-obligations.sh matches check-run names against
# /revdep|ecosystem/i, and before this workflow existed no name in this repo
# did, so every T2 pull request was unsatisfiable.
on:
  pull_request:
  workflow_dispatch:

name: ecosystem-check.yaml

permissions:
  contents: read

jobs:
  ecosystem-check:
    uses: ggsegverse/.github/.github/workflows/ecosystem-check.yaml@main
    secrets: inherit
